<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F2">
<title>Sedang offline · LoveyNest</title>
<style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #FFF9F2; color: #57394D;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 22rem; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.75rem; margin: 24px 0 8px; }
    p { color: #6E5E6B; line-height: 1.6; margin: 0 0 24px; }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #57394D; color: #FFFCF8; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #C88FA8; outline-offset: 3px; }
</style>
</head>
<body>
<main>
    <svg width="120" height="120" viewBox="0 0 160 160" aria-hidden="true">
        <circle cx="62" cy="80" r="46" fill="#F4DCE6"/>
        <circle cx="98" cy="80" r="46" fill="#E9E3F8" style="mix-blend-mode:multiply"/>
        <path d="M80 100c-9-6.5-17-13-17-21.5 0-5.4 4.1-9.5 9.2-9.5 3.4 0 6.3 1.8 7.8 4.6 1.5-2.8 4.4-4.6 7.8-4.6 5.1 0 9.2 4.1 9.2 9.5 0 8.5-8 15-17 21.5Z" fill="#8A4D68"/>
    </svg>
    <h1>Sedang offline</h1>
    <p>LoveyNest belum bisa terhubung ke server. Periksa sinyal atau Wi-Fi, lalu coba lagi. Kalau sinyal lancar, server mungkin sedang sibuk atau diperbarui; tunggu sebentar.</p>
    <button type="button" id="retry">Coba lagi</button>
</main>
<script src="/offline.js"></script>
</body>
</html>
